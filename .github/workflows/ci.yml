# PR 建置檢查：型別 + 建置 + 弱點掃描
#
# 部署 workflow 只跑在 main。這支跑在 PR 上，讓「會不會編不過」在合併前就看得到，
# 而不是合併完才在部署階段炸掉。

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 預設逾時是 6 小時。真的跑起來約 2 分鐘；卡住代表壞了，
    # 不該讓它燒掉幾小時的額度（公開 repo 雖然不計費，但會塞住後面的工作）。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 單元測試（node --test，無測試框架相依）
        run: npm test

      - name: 型別檢查與建置（tsc -b && vite build）
        run: npm run build

      - name: 弱點掃描（會上線的相依套件）
        # 擋 PR 的只有「真的會打包進瀏覽器」的相依套件（leaflet/react/zustand 等）。
        # 這才是使用者端真正承受風險的範圍。moderate 以下不擋，避免上游一有風吹草動就卡住。
        run: npm audit --omit=dev --audit-level=high

      - name: 弱點掃描（建置工具，僅提示不擋）
        # devDependencies 的弱點只印出來看，不擋合併。
        # 目前已知殘留：tailwindcss 3.x 透過 chokidar/micromatch 帶進 braces，
        # 以及 postcss-selector-parser——兩者都只有「升到 tailwindcss 4」才能解，
        # 那是會動到整份 CSS 設定的破壞性改版，不適合夾在功能 PR 裡做。
        # 這些是本機建置期的 DoS 類弱點（要餵惡意 glob／CSS 選擇器才觸發），
        # 不會隨 dist 出貨，線上使用者碰不到。
        run: npm audit --audit-level=high || true
