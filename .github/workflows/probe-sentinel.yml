# 暫時性：看 Sentinel Hub WMS 的錯誤格式與 CORS。假 Instance ID、不讀 secret。量完就刪。
name: 探測 Sentinel WMS（暫時）
on:
  push:
    branches: [main]
    paths: [scripts/probe-sentinel.mjs, .github/workflows/probe-sentinel.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/probe-sentinel.mjs
