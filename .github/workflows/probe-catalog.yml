# 暫時性：問真正的 Copernicus 伺服器「哪個目錄端點還活著」。
#
# 排程盯梢對舊的 resto/api/.../search.json 拿到 404（上游正在汰除 OpenSearch），
# 而開發沙箱連不出去，所以借 Actions 當實驗台。修好之後這支會一起刪掉。
#
# 只能手動觸發，而且刻意不吃任何 secret——它用寫死的中性座標，
# 公開 repo 的 log 不會洩漏使用者在盯哪片海。
name: 探測目錄端點（暫時）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 探測各候選端點
        if: always()
        run: node scripts/probe-catalog.mjs
