# 暫時性：比較 GIBS 各 VIIRS 夜間圖層哪個看得到漁船燈火。不讀 secret，量完就刪。
name: 探測外部服務（暫時）
on:
  push:
    branches: [main]
    paths: [scripts/probe-external.mjs, .github/workflows/probe-external.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/probe-external.mjs
