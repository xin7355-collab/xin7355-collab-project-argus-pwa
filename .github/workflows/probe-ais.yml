# 暫時性：確認 aisstream 是否擋瀏覽器連線，以及自家 Worker 轉接是否打得通。假金鑰、不讀 secret。
name: 探測 AIS 連線（暫時）
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 逗號分隔的 wss 網址
        default: wss://stream.aisstream.io/v0/stream
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm i --no-save --no-package-lock ws@8.18.0
      - run: node scripts/probe-ais.mjs
        env:
          TARGETS: ${{ inputs.targets }}
