# 自動部署：main 有變動就 build + 上傳 Cloudflare Worker
#
# 為什麼需要這個：本專案以 wrangler 部署成 Cloudflare Worker（見 wrangler.jsonc
# 的說明：Access 鎖得住 Worker、鎖不住免網域的 pages.dev），而 Worker 不像
# Pages 有 Git 整合，不會自己重新 build。沒有這個 workflow 的話，PR 合併進
# main 之後手機上還是舊版——程式碼是新的，但沒有人把它送上去。
#
# 需要在 repo 設定兩個 secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Cloudflare 後台建立，權限選 "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 後台右側可複製
#
# 前端金鑰（VITE_*）是 build 期打包進去的，也要設成 secret，否則部署出去的版本
# 會沒有金鑰（App 仍可運作，但影像/AIS 會退回未設定金鑰的提示與模擬資料）。
# 這幾個沒設也不會讓 workflow 失敗，只是打包成空值。

name: Deploy to Cloudflare Worker

on:
  push:
    branches: [main]
  # 允許在 Actions 頁面手動觸發（例如只改了 Cloudflare 設定想重推一次）
  workflow_dispatch:

# 同時只跑一個部署；新的 push 進來就取消還在跑的舊的，避免舊版蓋掉新版
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 建置 + wrangler deploy 實測約 30 秒。給 20 分鐘已經很寬鬆。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 先擋掉「secret 沒設」這個最常見的情況，給看得懂的訊息。
      # 這裡刻意讓它失敗而不是靜默跳過：靜默跳過會重現「合併了但手機還是舊版」
      # 這個本來要解決的問題，紅燈才看得見。
      - name: 檢查部署所需 secret
        run: |
          # 先把前後／中間的空白與換行清掉再用。手機複製 token 很容易夾帶換行，
          # 那會讓 Cloudflare 回 6003「Invalid format for Authorization header」，
          # 而錯誤訊息完全看不出是空白造成的。清乾淨後再驗格式。
          # 清理後的值仍是機密，先 add-mask 確保不會出現在 log。
          tok="$(printf '%s' '${{ secrets.CLOUDFLARE_API_TOKEN }}' | tr -d '[:space:]')"
          acct="$(printf '%s' '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' | tr -d '[:space:]')"
          [ -n "$tok" ] && echo "::add-mask::$tok"
          [ -n "$acct" ] && echo "::add-mask::$acct"

          # 下面幾行會出現 secret/token 字樣，但印的都是「欄位名稱與說明」，
          # 真值在上面已經 ::add-mask:: 遮掉，而且只印長度（$tok_len）。
          # 靜態掃描只看關鍵字，所以在那幾行標 guardrails: ignore。
          missing=""
          [ -z "$tok" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$acct" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secret:$missing"  # guardrails: ignore（印的是欄位名稱，不是值）
            echo "請到 Settings → Secrets and variables → Actions → New repository secret 新增。"  # guardrails: ignore（純說明文字）
            echo "CLOUDFLARE_API_TOKEN：Cloudflare 後台 My Profile → API Tokens，範本選 Edit Cloudflare Workers"
            echo "CLOUDFLARE_ACCOUNT_ID：Cloudflare 後台 Workers & Pages 右側可複製"
            exit 1
          fi

          # Account ID 格式檢查：必須是 32 個十六進位字元。
          # 擋掉最常見的貼錯——整段網址、前後空白/換行、複製到一半、貼成帳號名稱。
          # 格式不符會讓 wrangler 噴 [code: 7003]「Could not route to ...」，
          # 那個訊息看不出是 ID 有問題，所以在這裡先攔下來講清楚。
          # 註：不印出實際值——本 repo 為公開，log 任何人都看得到。
          if ! printf '%s' "$acct" | grep -qE '^[0-9a-fA-F]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID 格式不正確（應為 32 個十六進位字元，例 1a2b3c...）"
            echo "去除空白後長度：$(printf '%s' "$acct" | wc -c) 字元（正確應為 32）"
            echo ""
            echo "怎麼拿到正確的值："
            echo "  Cloudflare 後台 → 左側 Compute → Workers & Pages"
            echo "  進去後看網址列：dash.cloudflare.com/<這一段32碼>/workers-and-pages"
            echo "  只複製那 32 碼，不要含網址其他部分"
            echo ""
            echo "常見貼錯：貼成整段網址、貼成 Zone ID（那是網域用的，不是帳號）"
            exit 1
          fi

          # API Token 的健全性檢查——刻意「寬鬆」。
          #
          # 這裡原本寫死「必須正好 40 個字元」，那是依照舊版 Cloudflare token 的長度。
          # 實際遇到使用者拿到 53 字元的 token 被這條規則擋下來，而真正的格式
          # 權威是 Cloudflare 自己，不是這個 workflow。長度寫死只會在 Cloudflare
          # 改格式時變成假警報，把人擋在門外還叫他重做一次表單。
          #
          # 所以這裡只擋「一看就知道不可能對」的情況，其餘交給 wrangler 去碰釘子：
          # 真的錯會回 6003（Invalid format）或 9109（Invalid access token），
          # 空白已在上面清掉了，所以那時的錯誤訊息是可信的。
          tok_len=$(printf '%s' "$tok" | wc -c)

          # 非 ASCII：多半是複製時夾到全形引號、全形空格或中文字。
          # 這種情況長度看起來正常但其實是壞的，單看長度查不出來，所以特別點名。
          if printf '%s' "$tok" | LC_ALL=C grep -qP '[^\x20-\x7E]'; then
            echo "::error::CLOUDFLARE_API_TOKEN 含有非 ASCII 字元（通常是複製時夾到全形引號／全形空格／中文字）"
            echo "長度：$tok_len 位元組。請重新複製一次，只複製那串英數字本身。"
            exit 1
          fi

          # charset：Cloudflare token 用的是 URL-safe 字元。出現空白以外的符號
          # （例如 Bearer 的空格已被清掉，但引號、冒號、斜線不會）代表多貼了東西。
          if ! printf '%s' "$tok" | grep -qE '^[A-Za-z0-9._~-]+$'; then
            echo "::error::CLOUDFLARE_API_TOKEN 含有不該出現的符號（如引號、冒號、斜線）"
            echo "長度：$tok_len 字元。常見原因：連 \"Authorization: Bearer ...\" 整行一起貼、"
            echo "或貼成 JSON 片段。請只貼 token 本身。"  # guardrails: ignore（純說明文字）
            exit 1
          fi

          # 長度只做極寬鬆的合理性檢查：擋空字串與明顯複製到一半/整頁貼上。
          if [ "$tok_len" -lt 20 ] || [ "$tok_len" -gt 200 ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 長度不合理（$tok_len 字元）"
            echo "太短通常是複製到一半，太長通常是整段文字一起貼到了。"
            echo ""
            echo "怎麼拿到正確的值："
            echo "  Cloudflare 後台 → 右上角人頭 → My Profile → API Tokens"
            echo "  → Create Token → 範本選「Edit Cloudflare Workers」→ Use template"
            echo "  → Account Resources 選自己的帳號、Zone Resources 選 All zones"
            echo "  → Continue to summary → Create Token → 複製那串（只會顯示這一次）"
            exit 1
          fi

          # 走到這裡就不再自作主張，讓 Cloudflare 去判定。
          echo "Token 通過健全性檢查（$tok_len 字元）。實際有效性由 Cloudflare 判定。"

          # 通過檢查 → 把清乾淨的值傳給後續步驟使用（已 add-mask，不會外洩到 log）
          {
            echo "CF_API_TOKEN=$tok"
            echo "CF_ACCOUNT_ID=$acct"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依（照 lockfile，不動版本）
        run: npm ci

      - name: 型別檢查與建置
        run: npm run build
        env:
          VITE_SENTINEL_INSTANCE_ID: ${{ secrets.VITE_SENTINEL_INSTANCE_ID }}
          VITE_SENTINEL_WMS_URL: ${{ secrets.VITE_SENTINEL_WMS_URL }}
          VITE_EDGE_AI_URL: ${{ secrets.VITE_EDGE_AI_URL }}
          VITE_AISSTREAM_KEY: ${{ secrets.VITE_AISSTREAM_KEY }}

      # 直接跑專案自己釘住的 wrangler，不用 cloudflare/wrangler-action。
      # 原因：那個 action 會拿自己的預設版本(3.90)去比對，比不過就強制裝 3.90，
      # 而 wrangler 3 不支援「純靜態資產 Worker」(只有 assets、沒有 main)，
      # 會噴 "Missing entry-point" 而失敗。改為直接呼叫 devDependencies 裡的
      # wrangler 4，版本由 package-lock.json 決定，CI 與本機一致。
      # wrangler 原生讀這兩個環境變數，不需要額外登入步驟。
      - name: 部署到 Cloudflare Worker
        env:
          # 用 preflight 清理並驗過格式的值，不是原始 secret
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          # 從輸出撈 workers.dev 網址；撈不到不讓步驟失敗（部署本身已經成功）
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)"
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      # 把網址印在 Actions 的 Summary 頁，部署完直接點就能開，
      # 不用再去 Cloudflare 後台翻。
      - name: 顯示部署網址
        if: success()
        run: |
          url="$DEPLOY_URL"
          {
            echo "## ✅ 部署完成"
            echo ""
            if [ -n "$url" ]; then
              echo "**網址：** $url"
            else
              echo "網址請見上一步 wrangler 輸出（或 Cloudflare 後台 → Workers & Pages → argus-app）。"
            fi
            echo ""
            echo "確認手機拿到新版：雷達面板右上角有「浬 / km」切換鈕即為新版。"
            echo "若仍是舊版，把 App 從多工列滑掉重開；再不行就刪掉主畫面圖示重新加入。"
          } >> "$GITHUB_STEP_SUMMARY"
